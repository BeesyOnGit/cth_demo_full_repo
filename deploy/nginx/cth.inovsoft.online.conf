# Host nginx site for the container in deploy/docker-compose.yml (front end + API on one port). Install:
#   sudo cp cth.inovsoft.online.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cth.inovsoft.online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: `sudo certbot --nginx -d cth.inovsoft.online -d api.cth.inovsoft.online`
# (if the existing sites already have certificates, only change their proxy_pass to the upstream below).

upstream cth_app {
    server 127.0.0.1:3010;  # = PORT in the VPS .env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # The front end calls the API on its own origin; api.cth is kept so old links keep working
    server_name cth.inovsoft.online api.cth.inovsoft.online;

    client_max_body_size 10m;

    location / {
        proxy_pass http://cth_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app trusts loopback proxies for the client IP (rate limits)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Invoice PDF generation can take a while
        proxy_read_timeout 120s;
    }
}
